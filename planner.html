function toggleTheme(){var c=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',c);localStorage.setItem('theme',c);var b=document.getElementById('themeBtn');if(b)b.textContent=c==='light'?'🌙':'☀️';}
function cycleFont(){var cur=document.documentElement.getAttribute('data-fs')||'';var n=cur===''?'lg':(cur==='lg'?'xl':'');if(n)document.documentElement.setAttribute('data-fs',n);else document.documentElement.removeAttribute('data-fs');localStorage.setItem('fs',n);var b=document.getElementById('fsBtn');if(b)b.textContent=n==='lg'?'字＋':(n==='xl'?'字＋＋':'字');}

<style>

*{box-sizing:border-box;margin:0;padding:0}

:root[data-fs="xl"] .verse{font-size:17px}:root[data-fs="xl"] .dch{font-size:17px}:root[data-fs="xl"] .summary{font-size:16.5px}:root[data-fs="xl"] .cpiece .vtxt{font-size:15.5px}

.toast.show{opacity:1}

</style>

<main>
  <div class="syncbar" id="syncBar"></div>

<script>
const BID={"創":1,"出":2,"利":3,"民":4,"申":5,"書":6,"士":7,"得":8,"撒上":9,"撒下":10,"王上":11,"王下":12,"代上":13,"代下":14,"拉":15,"尼":16,"斯":17,"伯":18,"詩":19,"箴":20,"傳":21,"歌":22,"賽":23,"耶":24,"哀":25,"結":26,"但":27,"何":28,"珥":29,"摩":30,"俄":31,"拿":32,"彌":33,"鴻":34,"哈":35,"番":36,"該":37,"亞":38,"瑪":39,"太":40,"可":41,"路":42,"約":43,"徒":44,"羅":45,"林前":46,"林後":47,"加":48,"弗":49,"腓":50,"西":51,"帖前":52,"帖後":53,"提前":54,"提後":55,"多":56,"門":57,"來":58,"雅":59,"彼前":60,"彼後":61,"約壹":62,"約貳":63,"約參":64,"猶":65,"啟":66};
let BOOKS=[], YTMAP={}, ORDER=[], FULL2ABBR={}, ID2BOOK={};
let plan=[], planSig="", order="canon", pace="perday", selected=new Set();
const OT=new Set(Array.from({length:39},(_,i)=>i+1)), GOSPEL=new Set([40,41,42,43]);

// ── 雲端同步設定（在 Firebase Console 建專案後填入；見 CLAUDE.md §11）──
const FIREBASE_CONFIG={apiKey:"AIzaSyDjlL_b4Uiz0cAQjbdCiePZO9oXrEQm0zI",authDomain:"daily-bread-f88ac.firebaseapp.com",projectId:"daily-bread-f88ac",storageBucket:"daily-bread-f88ac.firebasestorage.app",messagingSenderId:"258444297032",appId:"1:258444297032:web:2287e0259ef81a0ca0a97d"};
const CLOUD_ENABLED=!Object.values(FIREBASE_CONFIG).some(v=>String(v).includes("填入"));
let uid=null, cloudReady=false, restoring=false, syncMode="none", syncCode="";

async function boot(){
  [BOOKS,YTMAP,ORDER]=await Promise.all([
    fetch("data/bible_books.json").then(r=>r.json()),
    fetch("data/yt_map.json").then(r=>r.json()),
    fetch("data/reading_order.json").then(r=>r.json()),
  ]);
  BOOKS.forEach(b=>{FULL2ABBR[b.full]=b.abbr;ID2BOOK[b.id]=b;});
  // 書卷格子
  const el=document.getElementById("books");
  el.innerHTML=BOOKS.map(b=>`<div class="bk on" data-id="${b.id}" onclick="toggleBook(${b.id})">${b.full}</div>`).join("");
  BOOKS.forEach(b=>selected.add(b.id));
  document.getElementById("startDate").value=new Date().toLocaleDateString("sv").slice(0,10);
  // segmented controls
  segInit("orderSeg",v=>order=v);
  segInit("paceSeg",v=>{pace=v;document.getElementById("perdayBox").style.display=v==="perday"?"":"none";document.getElementById("byendBox").style.display=v==="byend"?"":"none";});
  initCloud();
}
function segInit(id,cb){
  const seg=document.getElementById(id);
  seg.querySelectorAll("button").forEach(b=>b.onclick=()=>{seg.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");cb(b.dataset.v);});
}
function toggleBook(id){selected.has(id)?selected.delete(id):selected.add(id);refreshBooks();}
function refreshBooks(){document.querySelectorAll(".bk").forEach(e=>e.classList.toggle("on",selected.has(+e.dataset.id)));}
function pick(kind){
  selected.clear();
  for(const b of BOOKS){
    if(kind==="all")selected.add(b.id);
    else if(kind==="ot"&&OT.has(b.id))selected.add(b.id);
    else if(kind==="nt"&&!OT.has(b.id))selected.add(b.id);
    else if(kind==="gospel"&&GOSPEL.has(b.id))selected.add(b.id);
  }
  refreshBooks();
}

// 產生「章單位」清單（每筆 = 一章）
function unitsFor(){
  let units=[];
  if(order==="canon"){
    for(const b of BOOKS){
      if(!selected.has(b.id))continue;
      if(b.chapters===1)units.push({full:b.full,ch:1,single:true});
      else for(let c=1;c<=b.chapters;c++)units.push({full:b.full,ch:c,single:false});
    }
  }else{ // church：照 reading_order，過濾選取書卷
    const sel=new Set([...selected].map(id=>ID2BOOK[id].full));
    for(const key of ORDER){
      const m=key.match(/^(.+?)(\d+)?$/);
      let full=key, ch=1, single=true;
      // 用書卷全名比對（最長優先）
      const hit=BOOKS.find(b=>key.startsWith(b.full));
      if(!hit)continue;
      full=hit.full; single=hit.chapters===1;
      ch=single?1:parseInt(key.slice(hit.full.length))||1;
      if(sel.has(full))units.push({full,ch,single});
    }
  }
  return units;
}
function ytKey(u){return u.full+(u.single?"":u.ch);}
function label(u){return u.full+(u.single?"":u.ch);}

function generate(){
  const units=unitsFor();
  if(!units.length){alert("請至少選一卷書");return;}
  const start=new Date(document.getElementById("startDate").value+"T00:00:00");
  if(isNaN(start)){alert("請選起始日");return;}
  let cpd;
  if(pace==="perday"){
    cpd=Math.max(1,parseInt(document.getElementById("cpd").value)||1);
  }else{
    const end=new Date(document.getElementById("endDate").value+"T00:00:00");
    if(isNaN(end)||end<start){alert("請選有效的完成日（需晚於起始日）");return;}
    const days=Math.round((end-start)/86400000)+1;
    cpd=Math.max(1,Math.ceil(units.length/days));
  }
  plan=[];
  for(let i=0;i<units.length;i+=cpd){
    const d=new Date(start.getTime()+ (plan.length)*86400000);
    plan.push({date:d.toLocaleDateString("sv").slice(0,10), units:units.slice(i,i+cpd)});
  }
  planSig="plan_"+order+"_"+units.length+"_"+cpd+"_"+plan[0].date;
  renderPlan();
  cloudPush();
}

function getDone(){try{return new Set(JSON.parse(localStorage.getItem(planSig)||"[]"));}catch(e){return new Set();}}
function setDone(s){localStorage.setItem(planSig,JSON.stringify([...s]));cloudPush();}

function renderPlan(){
  const done=getDone();
  const total=plan.length, last=plan[plan.length-1];
  document.getElementById("result").style.display="block";
  const cpd=Math.max(...plan.map(p=>p.units.length));
  document.getElementById("summary").innerHTML=
    `共 <b>${plan.reduce((s,p)=>s+p.units.length,0)}</b> 章，分 <b>${total}</b> 天，`+
    `${pace==="perday"?`每天 <b>${cpd}</b> 章`:`每天約 <b>${cpd}</b> 章`}，`+
    `<b>${plan[0].date}</b> 起，預計 <b>${last.date}</b> 完成。`;
  const list=document.getElementById("planList");
  list.innerHTML="";
  const todayStr=new Date().toLocaleDateString("sv").slice(0,10);
  plan.forEach((p,idx)=>{
    const isDone=done.has(idx);
    const isToday=p.date===todayStr;
    const wd="日一二三四五六"[new Date(p.date+"T00:00:00").getDay()];
    const lab=p.units.map(label).join("、");
    const day=document.createElement("div");day.className="day"+(isToday?" today":"");
    day.innerHTML=
      `<div class="day-h ${isDone?'done':''}">
        <input type="checkbox" class="chk" ${isDone?'checked':''}>
        <span class="dnum">第${idx+1}天<br>${p.date.slice(5)} 週${wd}</span>
        <span class="dch ${isDone?'done':''}">${lab}${isToday?'<span class="todaybadge">今天</span>':''}</span>
       </div>
       <div class="day-b"></div>`;
    const head=day.querySelector(".day-h"), body=day.querySelector(".day-b"), chk=day.querySelector(".chk");
    chk.onclick=e=>{e.stopPropagation();const s=getDone();chk.checked?s.add(idx):s.delete(idx);setDone(s);renderProgress();head.classList.toggle("done",chk.checked);day.querySelector(".dch").classList.toggle("done",chk.checked);};
    head.onclick=()=>{if(body.classList.toggle("open")&&!body.dataset.loaded){loadDayDetail(body,p.units);body.dataset.loaded="1";}};
    list.appendChild(day);
  });
  renderProgress();
}
function playPV(btn,vid){var box=btn.parentElement.querySelector('.pvembed');if(!box)return;box.innerHTML='<div class="ytembed"><iframe src="https://www.youtube.com/embed/'+vid+'?autoplay=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="讀經影片"></iframe></div>';btn.style.display='none';}
function jumpToday(){
  const days=document.querySelectorAll('#planList .day');
  if(!days.length)return;
  let target=document.querySelector('#planList .day.today');
  if(!target){const done=getDone();for(let i=0;i<plan.length;i++){if(!done.has(i)){target=days[i];break;}}}
  if(!target)target=days[days.length-1];
  target.scrollIntoView({behavior:'smooth',block:'center'});
}
function renderProgress(){
  const done=getDone();
  document.getElementById("barFill").style.width=(done.size/plan.length*100)+"%";
}

function loadDayDetail(body,units){
  body.innerHTML=units.map((u,i)=>{
    const vid=YTMAP[ytKey(u)];
    const v=vid?`<button class="vid" onclick="playPV(this,'${vid}')">▶ 播放第一遍</button><a class="vid" style="margin-left:6px" href="https://www.youtube.com/watch?v=${vid}" target="_blank" rel="noopener">↗ YouTube</a><div class="pvembed"></div>`
               :`<span class="loading">（第一遍無此章影片）</span>`;
    return `<div class="cpiece"><div class="vtxt">${label(u)}</div>${v}<div class="vbox" data-k="${u.full}|${u.single?1:u.ch}"></div></div>`;
  }).join("");
  body.querySelectorAll(".vbox").forEach(box=>{
    const [full,ch]=box.dataset.k.split("|");
    fetchVerses(box, BID[FULL2ABBR[full]], ch);
  });
}
function fetchJson(api){
  const urls=[api,"https://api.allorigins.win/raw?url="+encodeURIComponent(api),"https://corsproxy.io/?url="+encodeURIComponent(api)];
  return new Promise((resolve,reject)=>{(function next(i){if(i>=urls.length)return reject();fetch(urls[i]).then(r=>{if(!r.ok)throw 0;return r.json();}).then(resolve).catch(()=>next(i+1));})(0);});
}
function fetchVerses(box,id,ch){
  box.innerHTML='<div class="loading">載入經文…</div>';
  fetchJson(`https://bolls.life/get-text/CUV/${id}/${ch}/`)
    .then(vs=>{box.innerHTML=vs.map(v=>`<div class="verse"><span class="vnum">${v.verse}</span><span>${(v.text||'').replace(/<[^>]+>/g,'').replace(/[\s　]/g,'')}</span></div>`).join("");})
    .catch(()=>{box.innerHTML='<div class="loading">經文載入失敗 </div>';const b=document.createElement("button");b.className="qbtn";b.textContent="↻ 重試";b.onclick=()=>fetchVerses(box,id,ch);box.appendChild(b);});
}

function planText(){
  return "📖 我的讀經計畫（每日靈糧·中靈版）\n"+plan.map((p,i)=>`${p.date} ${p.units.map(label).join("、")}`).join("\n");
}
function copyPlan(){navigator.clipboard.writeText(planText()).then(()=>{const t=document.getElementById("toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500);});}
function downloadPlan(){
  const csv="日期,章節\n"+plan.map(p=>`${p.date},${p.units.map(label).join(" ")}`).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv"}));a.download="我的讀經計畫.csv";a.click();
}
function resetProgress(){if(confirm("確定清除這份計畫的勾選進度？")){localStorage.removeItem(planSig);renderPlan();cloudPush();}}

// ── 雲端同步（Firebase + Google 登入）──
function segSet(id,v){const b=document.querySelector('#'+id+' button[data-v="'+v+'"]');if(b)b.click();}
function currentConfig(){return {order,pace,books:[...selected],start:document.getElementById("startDate").value,cpd:document.getElementById("cpd").value,end:document.getElementById("endDate").value};}
function applyConfig(c){
  restoring=true;
  try{
    if(c.order)segSet("orderSeg",c.order);
    if(c.pace)segSet("paceSeg",c.pace);
    if(Array.isArray(c.books)){selected=new Set(c.books);refreshBooks();}
    if(c.start)document.getElementById("startDate").value=c.start;
    if(c.cpd)document.getElementById("cpd").value=c.cpd;
    if(c.end)document.getElementById("endDate").value=c.end;
  }finally{restoring=false;}
}
function syncDoc(){
  if(!cloudReady)return null;
  const db=firebase.firestore();
  if(syncMode==="google"&&uid)return db.collection("users").doc(uid);
  if(syncMode==="code"&&syncCode)return db.collection("codes").doc(syncCode);
  return null;
}
async function ensureAnon(){ if(cloudReady&&!firebase.auth().currentUser) await firebase.auth().signInAnonymously(); }
function genCode(){const s="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";return Array.from({length:6},()=>s[Math.floor(Math.random()*s.length)]).join("");}

function initCloud(){
  syncCode=localStorage.getItem("syncCode")||"";
  updateSyncUI();
  if(!CLOUD_ENABLED||!window.firebase)return;
  try{firebase.initializeApp(FIREBASE_CONFIG);cloudReady=true;}catch(e){console.warn("Firebase init 失敗",e);return;}
  firebase.auth().onAuthStateChanged(async u=>{
    if(u&&!u.isAnonymous){uid=u.uid;syncMode="google";updateSyncUI();try{await pullCloud();}catch(e){console.warn(e);}}
    else if(u&&u.isAnonymous){uid=u.uid;if(syncCode){syncMode="code";try{await pullCloud();}catch(e){console.warn(e);}}updateSyncUI();}
    else{uid=null;syncMode="none";updateSyncUI();}
  });
  if(syncCode)ensureAnon().catch(e=>console.warn(e));
}
function cloudSignIn(){if(!cloudReady){alert("雲端尚未設定");return;}firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>alert("登入失敗："+e.message));}
function cloudSignOut(){if(cloudReady)firebase.auth().signOut();}

async function createCode(){
  if(!cloudReady){alert("雲端尚未設定（請先在 planner.html 填入 Firebase 金鑰，見 CLAUDE.md §11）");return;}
  try{await ensureAnon();}catch(e){alert("無法連線雲端（請確認 Firebase 已啟用匿名登入）");return;}
  syncCode=genCode();syncMode="code";localStorage.setItem("syncCode",syncCode);
  cloudPush();updateSyncUI();
  prompt("你的同步碼（請記下；在其他裝置點「輸入同步碼」打這組就會同步）：",syncCode);
}
async function enterCode(){
  if(!cloudReady){alert("雲端尚未設定");return;}
  const c=(prompt("輸入同步碼：")||"").trim().toUpperCase();
  if(!c)return;
  try{await ensureAnon();}catch(e){alert("無法連線雲端（請確認 Firebase 已啟用匿名登入）");return;}
  syncCode=c;syncMode="code";localStorage.setItem("syncCode",c);
  try{await pullCloud();}catch(e){console.warn(e);}
  updateSyncUI();
}
function disableCode(){syncCode="";localStorage.removeItem("syncCode");if(syncMode==="code")syncMode="none";updateSyncUI();}

async function pullCloud(){
  const ref=syncDoc();if(!ref)return;
  const snap=await ref.get();
  if(!snap.exists){if(plan.length)cloudPush();return;}
  const d=snap.data()||{};
  if(d.planConfig){applyConfig(d.planConfig);generate();}
  if(planSig&&d.progress&&d.progress[planSig]){localStorage.setItem(planSig,JSON.stringify(d.progress[planSig]));renderPlan();}
}
function cloudPush(){
  const ref=syncDoc();if(!ref||restoring||!planSig)return;
  const prog={};prog[planSig]=[...getDone()];
  ref.set({planConfig:currentConfig(),progress:prog,ts:Date.now()},{merge:true}).catch(e=>console.warn(e));
}
function updateSyncUI(){
  const bar=document.getElementById("syncBar");if(!bar)return;
  if(!CLOUD_ENABLED){bar.innerHTML='<span class="syncdot"></span>進度存於本機（雲端尚未設定）';return;}
  let g,c;
  if(syncMode==="google"&&uid){const u=firebase.auth().currentUser;g='已登入：'+((u&&(u.email||u.displayName))||"Google")+' <button class="syncbtn" onclick="cloudSignOut()">登出</button>';}
  else g='<button class="syncbtn" onclick="cloudSignIn()">☁ Google 登入</button>';
  if(syncMode==="code"&&syncCode)c='同步碼：<b style="color:var(--acc3)">'+syncCode+'</b> <button class="syncbtn" onclick="disableCode()">停用</button>';
  else c='<button class="syncbtn" onclick="createCode()">🔢 建立同步碼</button> <button class="syncbtn" onclick="enterCode()">輸入同步碼</button>';
  const on=((syncMode==="google"&&uid)||(syncMode==="code"&&syncCode))?' on':'';
  bar.innerHTML='<span class="syncdot'+on+'"></span>'+g+' ｜ '+c;
}

boot();
</script>
