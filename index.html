<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日靈糧（中靈版）</title>
<script>
(function(){var t=localStorage.getItem('theme')||((window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark');document.documentElement.setAttribute('data-theme',t);var fs=localStorage.getItem('fs')||'';if(fs)document.documentElement.setAttribute('data-fs',fs);})();
function toggleTheme(){var c=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',c);localStorage.setItem('theme',c);var b=document.getElementById('themeBtn');if(b)b.textContent=c==='light'?'🌙':'☀️';}
function cycleFont(){var cur=document.documentElement.getAttribute('data-fs')||'';var n=cur===''?'lg':(cur==='lg'?'xl':'');if(n)document.documentElement.setAttribute('data-fs',n);else document.documentElement.removeAttribute('data-fs');localStorage.setItem('fs',n);var b=document.getElementById('fsBtn');if(b)b.textContent=n==='lg'?'字＋':(n==='xl'?'字＋＋':'字');}
document.addEventListener('DOMContentLoaded',function(){var tb=document.getElementById('themeBtn');if(tb)tb.textContent=document.documentElement.getAttribute('data-theme')==='light'?'🌙':'☀️';var fb=document.getElementById('fsBtn');if(fb){var fs=document.documentElement.getAttribute('data-fs')||'';fb.textContent=fs==='lg'?'字＋':(fs==='xl'?'字＋＋':'字');}});
</script>
<style>
:root{--bg:#0f1117;--sur:#1a1d27;--sur2:#22263a;--acc:#6c8fff;--acc2:#a78bfa;--acc3:#34d399;--tx:#e8eaf0;--tx2:#9ea3b8;--bdr:#2e3248;--red:#f87171;--yel:#fbbf24}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;min-height:100vh;padding-bottom:60px}
header{background:linear-gradient(135deg,#1a1d27,#12152a);border-bottom:1px solid var(--bdr);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.logo h1{font-size:16px;font-weight:700}
.logo p{font-size:10px;color:var(--tx2);margin-top:1px}
.nav{display:flex;gap:6px;align-items:center}
.nav a{font-size:12.5px;text-decoration:none;color:var(--tx2);padding:6px 14px;border-radius:18px;border:1.5px solid var(--bdr)}
.nav a.on{background:var(--acc);color:#000;border-color:var(--acc);font-weight:700}
.themebtn{background:transparent;border:1.5px solid var(--bdr);color:var(--tx2);border-radius:18px;padding:6px 11px;font-size:13px;cursor:pointer;line-height:1;font-family:inherit}
.themebtn:hover{border-color:var(--acc)}
.hdr-r{text-align:right}
:root[data-theme="light"]{--bg:#f4f6fb;--sur:#ffffff;--sur2:#eef1f8;--acc:#3b5bdb;--acc2:#6741d9;--acc3:#0ca678;--tx:#1b1f2a;--tx2:#5c6378;--bdr:#dde2ec;--red:#e03131;--yel:#b8860b}
:root[data-theme="light"] header{background:linear-gradient(135deg,#ffffff,#eef1f8)}
:root[data-theme="light"] .nav a.on{color:#fff}
:root[data-theme="light"] .btn-copy{color:#fff}
:root[data-theme="light"] .sday.on .sd,:root[data-theme="light"] .sday.on .sc{color:#fff}
:root[data-fs="lg"] .verse{font-size:16px}:root[data-fs="lg"] .notes-txt{font-size:15px}:root[data-fs="lg"] .yt-title{font-size:15px}:root[data-fs="lg"] .block-title{font-size:30px}
:root[data-fs="xl"] .verse{font-size:18.5px}:root[data-fs="xl"] .notes-txt{font-size:17px}:root[data-fs="xl"] .yt-title{font-size:16.5px}:root[data-fs="xl"] .block-title{font-size:34px}
.hdr-date{font-size:18px;font-weight:800;color:var(--acc)}
.hdr-day{font-size:10px;color:var(--tx2);margin-top:2px}
main{max-width:820px;margin:0 auto;padding:16px 16px 0}
.block{background:var(--sur);border:1px solid var(--bdr);border-radius:12px;margin-bottom:12px;overflow:hidden}
.block-hdr{padding:14px 16px 0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.block-tag{font-size:9px;color:var(--tx2);letter-spacing:1.5px;text-transform:uppercase;font-weight:700;white-space:nowrap}
.block-title{font-size:26px;font-weight:800;line-height:1.15;color:var(--tx)}
.block-body{padding:12px 16px 16px}
.verse-wrap{max-height:340px;overflow-y:auto;padding-right:4px}
.verse-wrap::-webkit-scrollbar{width:4px}.verse-wrap::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px}
.stitle{font-size:11.5px;color:var(--acc2);font-weight:600;margin:10px 0 4px}
.verse{display:flex;gap:8px;margin-bottom:7px;line-height:1.85;font-size:14px}
.vnum{color:var(--acc);font-size:10.5px;font-weight:700;min-width:20px;margin-top:3px;flex-shrink:0}
.loading{color:var(--tx2);font-size:12.5px;padding:14px 0;text-align:center}
.bg-link{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:7px;background:rgba(108,143,255,.1);border:1.5px solid rgba(108,143,255,.3);color:var(--acc);font-size:12px;text-decoration:none;margin-top:8px}
.bg-link:hover{background:rgba(108,143,255,.2)}
.yt-card{display:flex;gap:12px;align-items:flex-start;cursor:pointer;text-decoration:none;border-radius:8px;padding:4px;transition:background .15s}
.yt-card:hover{background:var(--sur2)}
.yt-thumb{flex-shrink:0;width:150px;border-radius:6px;overflow:hidden;aspect-ratio:16/9;background:#000}
.yt-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.yt-info{flex:1;min-width:0}
.yt-title{font-size:13.5px;color:var(--tx);line-height:1.5;margin-bottom:6px}
.yt-play{display:inline-flex;align-items:center;gap:5px;margin-top:4px;padding:6px 14px;border-radius:7px;background:var(--red);color:#fff;font-size:12.5px;font-weight:600}
.yt-miss{font-size:12px;color:var(--yel)}
.btn-copy{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:9px 16px;border-radius:8px;background:var(--acc3);color:#06281c;font-size:13px;font-weight:700;border:none;cursor:pointer;font-family:inherit}
.btn-copy:hover{filter:brightness(1.08)}
.notes-txt{font-size:13px;line-height:1.95;color:var(--tx2);max-height:220px;overflow-y:auto;padding-right:4px;white-space:pre-wrap}
.range{font-size:22px;font-weight:800;color:var(--acc2);margin-bottom:2px}
.row3{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.row3{grid-template-columns:1fr}.yt-thumb{width:120px}}
.strip-lbl{font-size:11px;color:var(--tx2);padding:4px 4px 6px;font-weight:600;display:flex;align-items:center;gap:10px}
.mbtn{background:var(--sur2);border:1px solid var(--bdr);color:var(--tx2);border-radius:6px;padding:2px 9px;font-size:12px;cursor:pointer;font-family:inherit}
.mbtn.on{background:var(--acc);color:#000;border-color:var(--acc);font-weight:700}
.strip{display:flex;gap:5px;overflow-x:auto;padding:0 0 14px}
.sday{flex-shrink:0;width:62px;background:var(--sur);border:1px solid var(--bdr);border-radius:9px;padding:7px 4px;text-align:center;cursor:pointer;transition:all .12s}
.sday:hover{border-color:var(--acc)}
.sday.on{background:var(--acc);border-color:var(--acc)}
.sday.on .sd,.sday.on .sc{color:#000}
.sd{font-size:11px;color:var(--tx2);font-weight:700}
.sc{font-size:12px;color:var(--tx);margin-top:2px;font-weight:600}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--acc3);color:#06281c;padding:10px 20px;border-radius:8px;font-weight:700;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="logo"><h1>📖 每日靈糧（中靈版）</h1><p>陪你讀聖經 · 第一遍</p></div>
  <nav class="nav"><a href="index.html" class="on">每日進度</a><a href="planner.html">我的計畫</a><button id="fsBtn" class="themebtn" onclick="cycleFont()" title="字級大小">字</button><button id="themeBtn" class="themebtn" onclick="toggleTheme()" title="切換深／淺色">☀️</button></nav>
  <div class="hdr-r"><div class="hdr-date" id="hdrDate">—</div><div class="hdr-day" id="hdrDay"></div></div>
</header>
<main>
  <div class="strip-lbl"><span id="stripLbl"></span><span id="monthBtns"></span><button class="mbtn" id="todayBtn" onclick="goToday()" style="display:none">📍 回到今天</button></div>
  <div class="strip" id="strip"></div>

  <!-- 靈修進度 -->
  <div class="block">
    <div class="block-hdr"><span class="block-tag">靈修進度</span><span class="block-title" id="devTitle">—</span></div>
    <div class="block-body">
      <div id="ytArea"><div class="loading">—</div></div>
      <button class="btn-copy" id="shareBtn" onclick="shareLine()" style="background:#06c755;color:#fff">📤 分享到 LINE</button>
      <button class="btn-copy" id="copyBtn" onclick="copyLine()" style="margin-left:8px">📋 複製訊息</button>
      <div id="bibleArea" style="margin-top:14px"></div>
      <div id="notesWrap" style="display:none;margin-top:14px">
        <div class="stitle" id="notesTitle"></div>
        <div class="notes-txt" id="notesTxt"></div>
      </div>
    </div>
  </div>

  <!-- 速讀 -->
  <div class="row3">
    <div class="block"><div class="block-hdr"><span class="block-tag">速讀 5 章</span></div>
      <div class="block-body"><div class="range" id="s5">—</div><div id="s5link"></div></div></div>
    <div class="block"><div class="block-hdr"><span class="block-tag">速讀 10 章</span></div>
      <div class="block-body"><div class="range" id="s10">—</div><div id="s10link"></div></div></div>
  </div>
</main>
<div class="toast" id="toast">已複製！</div>

<script>
const BID={"創":1,"出":2,"利":3,"民":4,"申":5,"書":6,"士":7,"得":8,"撒上":9,"撒下":10,"王上":11,"王下":12,"代上":13,"代下":14,"拉":15,"尼":16,"斯":17,"伯":18,"詩":19,"箴":20,"傳":21,"歌":22,"賽":23,"耶":24,"哀":25,"結":26,"但":27,"何":28,"珥":29,"摩":30,"俄":31,"拿":32,"彌":33,"鴻":34,"哈":35,"番":36,"該":37,"亞":38,"瑪":39,"太":40,"可":41,"路":42,"約":43,"徒":44,"羅":45,"林前":46,"林後":47,"加":48,"弗":49,"腓":50,"西":51,"帖前":52,"帖後":53,"提前":54,"提後":55,"多":56,"門":57,"來":58,"雅":59,"彼前":60,"彼後":61,"約壹":62,"約貳":63,"約參":64,"猶":65,"啟":66};
const BGN={"創":"創世記","出":"出埃及記","利":"利未記","民":"民數記","申":"申命記","書":"約書亞記","士":"士師記","得":"路得記","撒上":"撒母耳記上","撒下":"撒母耳記下","王上":"列王紀上","王下":"列王紀下","代上":"歷代志上","代下":"歷代志下","拉":"以斯拉記","尼":"尼希米記","斯":"以斯帖記","伯":"約伯記","詩":"詩篇","箴":"箴言","傳":"傳道書","歌":"雅歌","賽":"以賽亞書","耶":"耶利米書","哀":"耶利米哀歌","結":"以西結書","但":"但以理書","何":"何西阿書","珥":"約珥書","摩":"阿摩司書","俄":"俄巴底亞書","拿":"約拿書","彌":"彌迦書","鴻":"那鴻書","哈":"哈巴谷書","番":"西番雅書","該":"哈該書","亞":"撒迦利亞書","瑪":"瑪拉基書","太":"馬太福音","可":"馬可福音","路":"路加福音","約":"約翰福音","徒":"使徒行傳","羅":"羅馬書","林前":"哥林多前書","林後":"哥林多後書","加":"加拉太書","弗":"以弗所書","腓":"腓立比書","西":"歌羅西書","帖前":"帖撒羅尼迦前書","帖後":"帖撒羅尼迦後書","提前":"提摩太前書","提後":"提摩太後書","多":"提多書","門":"腓利門書","來":"希伯來書","雅":"雅各書","彼前":"彼得前書","彼後":"彼得後書","約壹":"約翰一書","約貳":"約翰二書","約參":"約翰三書","猶":"猶大書","啟":"啟示錄"};
const ABBR=Object.keys(BID).sort((a,b)=>b.length-a.length);
const SINGLE={"俄":1,"門":1,"約貳":1,"約參":1,"猶":1};  // 單章書卷
const WD=["日","一","二","三","四","五","六"];

let SCHED={}, YTMAP={}, SUM={}, curKey="", curMonth="", TODAY="";

// 解析「代下8」「詩119」「約貳」→ {abbr,full,ch,unit,verses}
function parseRef(s){
  s=(s||"").trim();
  let verses="";
  const pv=s.match(/[（(]([^）)]*)[）)]/); if(pv){verses=pv[1];s=s.replace(/[（(][^）)]*[）)]/,"");}
  for(const k of ABBR){
    if(s.startsWith(k)){
      const rest=s.slice(k.length).replace(/[章篇]/g,"");
      const ch=parseInt(rest)||1;
      return {abbr:k,full:BGN[k],ch,unit:(k==="詩"?"篇":"章"),verses,single:!!SINGLE[k]};
    }
  }
  return null;
}
function ytKey(p){ return p.full + (p.single?"":p.ch); }   // 對應 yt_map / summary 的 key
function label(p){ return p.full + (p.single?"":p.ch+p.unit); }
function fmtMD(key){const [y,m,d]=key.split("-");return `${parseInt(m)}/${parseInt(d)}`;}

async function boot(){
  try{
    [SCHED,YTMAP,SUM]=await Promise.all([
      fetch("data/schedule.json").then(r=>r.json()),
      fetch("data/yt_map.json").then(r=>r.json()),
      fetch("data/summary.json").then(r=>r.json()).catch(()=>({})),
    ]);
  }catch(e){
    document.getElementById("bibleArea").innerHTML='<div class="loading">資料載入失敗，請以網頁伺服器或 GitHub Pages 開啟（無法直接用 file:// 開啟）。</div>';
    return;
  }
  const keys=Object.keys(SCHED).sort();
  const todayKey=new Date().toLocaleDateString("sv").slice(0,10); // YYYY-MM-DD 本地時區
  curKey = SCHED[todayKey]?todayKey : keys[keys.length-1];
  curMonth = curKey.slice(0,7);
  TODAY=todayKey;
  renderMonthBtns(keys);
  renderStrip();
  loadDay(curKey);
  if(SCHED[TODAY])document.getElementById("todayBtn").style.display="";
}
function goToday(){if(!SCHED[TODAY])return;curMonth=TODAY.slice(0,7);renderMonthBtns(Object.keys(SCHED).sort());curKey=TODAY;renderStrip();loadDay(TODAY);window.scrollTo({top:0,behavior:"smooth"});}

function renderMonthBtns(keys){
  const months=[...new Set(keys.map(k=>k.slice(0,7)))];
  document.getElementById("monthBtns").innerHTML=months.map(m=>{
    const mo=m.split("-")[1];
    return `<button class="mbtn${m===curMonth?" on":""}" onclick="switchMonth('${m}')">${parseInt(mo)}月</button>`;
  }).join(" ");
}
function switchMonth(m){curMonth=m;renderMonthBtns(Object.keys(SCHED).sort());renderStrip();}

function renderStrip(){
  const [y,mo]=curMonth.split("-");
  document.getElementById("stripLbl").textContent=`${y}年${parseInt(mo)}月`;
  const days=Object.keys(SCHED).filter(k=>k.startsWith(curMonth)).sort();
  const strip=document.getElementById("strip");strip.innerHTML="";
  for(const k of days){
    const el=document.createElement("div");
    el.className="sday"+(k===curKey?" on":"");
    el.innerHTML=`<div class="sd">${fmtMD(k)}</div><div class="sc">${SCHED[k].d}</div>`;
    el.onclick=()=>{curKey=k;document.querySelectorAll(".sday").forEach(s=>s.classList.remove("on"));el.classList.add("on");loadDay(k);window.scrollTo({top:0,behavior:"smooth"});};
    strip.appendChild(el);
  }
  const on=strip.querySelector(".sday.on"); if(on)setTimeout(()=>on.scrollIntoView({block:"nearest",inline:"center"}),100);
}

function loadDay(k){
  curKey=k;
  const d=new Date(k+"T00:00:00");
  document.getElementById("hdrDate").textContent=k.replace(/-/g,".");
  document.getElementById("hdrDay").textContent="星期"+WD[d.getDay()];
  const data=SCHED[k], p=parseRef(data.d);
  document.getElementById("devTitle").textContent=p?label(p):data.d;
  renderYT(p);
  renderBible(p);
  renderNotes(p);
  document.getElementById("s5").textContent=data.s5;
  document.getElementById("s10").textContent=data.s10;
  document.getElementById("s5link").innerHTML=readLink(data.s5);
  document.getElementById("s10link").innerHTML=readLink(data.s10);
}

function renderYT(p){
  const area=document.getElementById("ytArea");
  if(!p){area.innerHTML='<div class="loading">—</div>';return;}
  const vid=YTMAP[ytKey(p)], lab=label(p);
  if(vid){
    area.innerHTML=`<a class="yt-card" href="https://www.youtube.com/watch?v=${vid}" target="_blank" rel="noopener">
      <div class="yt-thumb"><img src="https://i.ytimg.com/vi/${vid}/hqdefault.jpg" loading="lazy"></div>
      <div class="yt-info"><div class="yt-title">${lab}／陪你讀聖經（第一遍）</div>
      <span class="yt-play">▶ 前往觀看</span></div></a>`;
  }else{
    area.innerHTML=`<div class="yt-miss">第一遍尚無此章影片。<a class="bg-link" href="https://www.youtube.com/@jam2939/search?query=${encodeURIComponent(lab)}" target="_blank">🔍 到頻道搜尋</a></div>`;
  }
}

// 依序嘗試：直連 → allorigins → corsproxy（解決 CORS 與單一代理失效）
function fetchJson(api){
  const urls=[api,"https://api.allorigins.win/raw?url="+encodeURIComponent(api),"https://corsproxy.io/?url="+encodeURIComponent(api)];
  return new Promise((resolve,reject)=>{
    (function next(i){
      if(i>=urls.length)return reject();
      fetch(urls[i]).then(r=>{if(!r.ok)throw 0;return r.json();}).then(resolve).catch(()=>next(i+1));
    })(0);
  });
}
function renderBible(p){
  const area=document.getElementById("bibleArea");
  if(!p){area.innerHTML="";return;}
  area.innerHTML='<div class="loading">載入經文…</div>';
  const api=`https://bolls.life/get-text/CUV/${BID[p.abbr]}/${p.ch}/`;
  fetchJson(api).then(vs=>{
    let h='<div class="verse-wrap">';
    for(const v of vs){if(v.title)h+=`<div class="stitle">${v.title}</div>`;h+=`<div class="verse"><span class="vnum">${v.verse}</span><span>${(v.text||"").replace(/<[^>]+>/g,"").replace(/[\s　]/g,"")}</span></div>`;}
    h+='</div>';
    h+=`<a class="bg-link" href="https://www.biblegateway.com/passage/?search=${encodeURIComponent(p.full+" "+p.ch)}&version=CUVMPT" target="_blank">↗ BibleGateway 和合本</a>`;
    area.innerHTML=h;
  }).catch(()=>{
    area.innerHTML='<div class="loading">經文載入失敗</div>';
    const b=document.createElement("button");b.className="bg-link";b.style.cursor="pointer";b.textContent="↻ 重試";b.onclick=()=>renderBible(p);area.appendChild(b);
    const a=document.createElement("a");a.className="bg-link";a.style.marginLeft="8px";a.target="_blank";a.href="https://www.biblegateway.com/passage/?search="+encodeURIComponent(p.full+" "+p.ch)+"&version=CUVMPT";a.textContent="↗ 改至 BibleGateway";area.appendChild(a);
  });
}

function renderNotes(p){
  const w=document.getElementById("notesWrap");
  const s=p?SUM[ytKey(p)]:"";
  if(s){w.style.display="block";document.getElementById("notesTitle").textContent="📝 "+label(p)+" 摘要";document.getElementById("notesTxt").textContent=s;}
  else w.style.display="none";
}

// 速讀讀經連結（取範圍起點）
function readLink(range){
  const p=parseRef((range||"").split("-")[0]);
  if(!p)return "";
  return `<a class="bg-link" href="https://bolls.life/CUV/${BID[p.abbr]}/${p.ch}/" target="_blank">↗ 開始讀經</a>`;
}

function buildMsg(){
  const data=SCHED[curKey], p=parseRef(data.d);
  const lab=p?label(p):data.d;
  const vid=p?YTMAP[ytKey(p)]:"";
  let msg=`📖 ${fmtMD(curKey)} 每日靈糧\n靈修進度：${lab}`;
  if(vid)msg+=`\n📺 https://youtu.be/${vid}`;
  msg+=`\n（速讀5章：${data.s5}　速讀10章：${data.s10}）`;
  return msg;
}
function copyLine(){navigator.clipboard.writeText(buildMsg()).then(()=>{const t=document.getElementById("toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1600);});}
function shareLine(){window.open("https://line.me/R/share?text="+encodeURIComponent(buildMsg()),"_blank");}

boot();
</script>
</body>
</html>
