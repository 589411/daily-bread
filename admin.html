<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>讀經名單管理 · 每日靈糧（中靈版）</title>
<script>
(function(){var t=localStorage.getItem('theme')||((window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark');document.documentElement.setAttribute('data-theme',t);})();
function toggleTheme(){var c=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',c);localStorage.setItem('theme',c);var b=document.getElementById('themeBtn');if(b)b.textContent=c==='light'?'🌙':'☀️';}
document.addEventListener('DOMContentLoaded',function(){var tb=document.getElementById('themeBtn');if(tb)tb.textContent=document.documentElement.getAttribute('data-theme')==='light'?'🌙':'☀️';});
</script>
<style>
:root{--bg:#0f1117;--sur:#1a1d27;--sur2:#22263a;--acc:#6c8fff;--acc2:#a78bfa;--acc3:#34d399;--tx:#e8eaf0;--tx2:#9ea3b8;--bdr:#2e3248;--red:#f87171;--yel:#fbbf24}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;min-height:100vh;padding-bottom:60px}
header{background:linear-gradient(135deg,#1a1d27,#12152a);border-bottom:1px solid var(--bdr);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.logo h1{font-size:15px;font-weight:700}
.nav{display:flex;gap:6px;align-items:center}
.nav a{font-size:12.5px;text-decoration:none;color:var(--tx2);padding:6px 14px;border-radius:18px;border:1.5px solid var(--bdr)}
.themebtn{background:transparent;border:1.5px solid var(--bdr);color:var(--tx2);border-radius:18px;padding:6px 11px;font-size:13px;cursor:pointer;line-height:1;font-family:inherit}
:root[data-theme="light"]{--bg:#f4f6fb;--sur:#ffffff;--sur2:#eef1f8;--acc:#3b5bdb;--acc2:#6741d9;--acc3:#0ca678;--tx:#1b1f2a;--tx2:#5c6378;--bdr:#dde2ec;--red:#e03131;--yel:#b8860b}
:root[data-theme="light"] header{background:linear-gradient(135deg,#ffffff,#eef1f8)}
main{max-width:1000px;margin:0 auto;padding:16px}
.block{background:var(--sur);border:1px solid var(--bdr);border-radius:12px;margin-bottom:14px;padding:16px}
h2{font-size:14px;color:var(--acc2);margin-bottom:12px;font-weight:700}
.qbtn{background:var(--sur2);border:1px solid var(--bdr);color:var(--tx2);border-radius:6px;padding:6px 12px;font-size:12.5px;cursor:pointer;font-family:inherit}
.qbtn:hover{border-color:var(--acc);color:var(--acc)}
.go{background:var(--acc3);color:#06281c;border:none;border-radius:9px;padding:11px 22px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit}
input[type=text]{background:var(--bg);border:1px solid var(--bdr);color:var(--tx);border-radius:7px;padding:7px 10px;font-size:13px;font-family:inherit}
.hint{font-size:12px;color:var(--tx2);line-height:1.7}
.uidbox{background:var(--sur2);border:1px dashed var(--bdr);border-radius:8px;padding:10px;font-family:monospace;font-size:13px;margin-top:8px;word-break:break-all}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bdr);white-space:nowrap}
th{color:var(--tx2);font-weight:700;font-size:12px;position:sticky;top:0;background:var(--sur)}
tr:hover td{background:var(--sur2)}
.bar{height:6px;background:var(--bdr);border-radius:4px;overflow:hidden;width:90px;display:inline-block;vertical-align:middle;margin-right:6px}
.bar>i{display:block;height:100%;background:var(--acc3)}
.tablewrap{overflow-x:auto;max-height:70vh;overflow-y:auto}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.badge{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--sur2);color:var(--tx2)}
.err{color:var(--red);font-size:13px}
.muted{color:var(--tx2)}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>
<header>
  <div class="logo"><h1>📋 讀經名單管理（僅限管理者）</h1></div>
  <div class="nav"><a href="index.html">每日進度</a><a href="planner.html">我的計畫</a><button id="themeBtn" class="themebtn" onclick="toggleTheme()">☀️</button></div>
</header>
<main>
  <div class="block">
    <h2>🔐 管理者登入</h2>
    <p class="hint">這頁只給教會指定的管理者使用，用來彙整所有會友的讀經進度名單（取代紙本登記）。<br>
    請用 Google 帳號登入；只有 Firestore 安全規則裡列名的帳號，才看得到完整名單。</p>
    <div id="authArea" style="margin-top:10px"></div>
    <div id="uidHint" style="display:none">
      <p class="hint" style="margin-top:10px">你目前還不在管理者名單裡。把下面這串 UID 交給網站維護者，貼到 Firestore 安全規則的管理者清單中即可：</p>
      <div class="uidbox" id="uidBox"></div>
    </div>
  </div>

  <div class="block" id="rosterBlock" style="display:none">
    <h2>👥 讀經進度名單</h2>
    <div class="toolbar">
      <input type="text" id="filterBox" placeholder="搜尋姓名或小組…" oninput="renderTable()" style="flex:1;min-width:160px">
      <button class="qbtn" onclick="loadRoster()">↻ 重新整理</button>
      <button class="qbtn" onclick="downloadCsv()">⬇ 下載 CSV（交給教會）</button>
      <span class="badge" id="countBadge"></span>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>姓名</th><th>小組／區</th><th>進度</th><th>來源</th><th>最後更新</th></tr></thead>
        <tbody id="rosterBody"></tbody>
      </table>
    </div>
  </div>

  <div id="errArea"></div>
</main>

<script>
const FIREBASE_CONFIG={apiKey:"AIzaSyDjlL_b4Uiz0cAQjbdCiePZO9oXrEQm0zI",authDomain:"daily-bread-f88ac.firebaseapp.com",projectId:"daily-bread-f88ac",storageBucket:"daily-bread-f88ac.firebasestorage.app",messagingSenderId:"258444297032",appId:"1:258444297032:web:2287e0259ef81a0ca0a97d"};
firebase.initializeApp(FIREBASE_CONFIG);
let rows=[];

function renderAuthArea(user){
  const el=document.getElementById("authArea");
  if(user){
    el.innerHTML='已登入：'+(user.displayName||user.email||"Google 使用者")+' <button class="qbtn" onclick="signOut()">登出</button>';
  }else{
    el.innerHTML='<button class="go" onclick="signIn()">☁ 用 Google 登入</button>';
  }
}
function signIn(){firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>showErr("登入失敗："+e.message));}
function signOut(){firebase.auth().signOut();}

function showErr(msg){document.getElementById("errArea").innerHTML='<p class="err">'+msg+'</p>';}
function clearErr(){document.getElementById("errArea").innerHTML='';}

firebase.auth().onAuthStateChanged(function(user){
  renderAuthArea(user);
  document.getElementById("uidHint").style.display="none";
  document.getElementById("rosterBlock").style.display="none";
  clearErr();
  if(user)loadRoster();
});

function fmtProgress(latestPlan){
  if(!latestPlan||!latestPlan.total)return '<span class="muted">尚未產生計畫</span>';
  const pct=latestPlan.pct||0;
  return '<span class="bar"><i style="width:'+pct+'%"></i></span>'+latestPlan.done+' / '+latestPlan.total+'（'+pct+'%）';
}
function fmtTime(ts){
  if(!ts)return '';
  try{return new Date(ts).toLocaleString('zh-TW',{hour12:false});}catch(e){return '';}
}

async function loadRoster(){
  clearErr();
  const db=firebase.firestore();
  rows=[];
  try{
    const [usersSnap, codesSnap] = await Promise.all([
      db.collection("users").get(),
      db.collection("codes").get(),
    ]);
    usersSnap.forEach(doc=>rows.push(toRow(doc,"Google 登入")));
    codesSnap.forEach(doc=>rows.push(toRow(doc,"同步碼")));
    document.getElementById("rosterBlock").style.display="block";
    document.getElementById("uidHint").style.display="none";
    renderTable();
  }catch(e){
    if(e && e.code==="permission-denied"){
      document.getElementById("uidBox").textContent=firebase.auth().currentUser?firebase.auth().currentUser.uid:"(尚未登入)";
      document.getElementById("uidHint").style.display="block";
      document.getElementById("rosterBlock").style.display="none";
    }else{
      showErr("讀取失敗："+e.message);
    }
  }
}
function toRow(doc,source){
  const d=doc.data()||{};
  const p=d.profile||{};
  return {id:doc.id, name:p.name||"", group:p.group||"", source, latestPlan:d.latestPlan||null, ts:d.ts||0};
}
function renderTable(){
  const q=(document.getElementById("filterBox").value||"").trim().toLowerCase();
  const filtered=rows.filter(r=>!q || (r.name+r.group).toLowerCase().includes(q));
  filtered.sort((a,b)=>{
    if(!a.name && b.name)return 1;
    if(a.name && !b.name)return -1;
    return a.name.localeCompare(b.name,'zh-Hant');
  });
  document.getElementById("rosterBody").innerHTML=filtered.map(r=>
    '<tr><td>'+(r.name||'<span class="muted">（尚未填寫姓名）</span>')+'</td>'+
    '<td>'+(r.group||'<span class="muted">—</span>')+'</td>'+
    '<td>'+fmtProgress(r.latestPlan)+'</td>'+
    '<td>'+r.source+'</td>'+
    '<td>'+fmtTime(r.ts)+'</td></tr>'
  ).join("");
  document.getElementById("countBadge").textContent="共 "+filtered.length+" 人"+(q?"（篩選中，全部 "+rows.length+" 人）":"");
}
function downloadCsv(){
  const q=(document.getElementById("filterBox").value||"").trim().toLowerCase();
  const filtered=rows.filter(r=>!q || (r.name+r.group).toLowerCase().includes(q));
  const header="姓名,小組區,進度百分比,已讀天數,總天數,來源,最後更新\n";
  const body=filtered.map(r=>{
    const lp=r.latestPlan||{};
    return [r.name,r.group,lp.pct!=null?lp.pct:"",lp.done!=null?lp.done:"",lp.total!=null?lp.total:"",r.source,fmtTime(r.ts)]
      .map(v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"').join(",");
  }).join("\n");
  const csv=header+body;
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv"}));
  a.download="讀經名單.csv";
  a.click();
}
</script>
</body>
</html>
