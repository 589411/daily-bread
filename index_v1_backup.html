<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中壢靈糧堂 每日靈糧</title>
<style>
:root{--bg:#0f1117;--sur:#1a1d27;--sur2:#22263a;--acc:#6c8fff;--acc2:#a78bfa;--acc3:#34d399;--tx:#e8eaf0;--tx2:#9ea3b8;--bdr:#2e3248;--red:#f87171;--yel:#fbbf24}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;min-height:100vh;padding-bottom:60px}
header{background:linear-gradient(135deg,#1a1d27,#12152a);border-bottom:1px solid var(--bdr);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.logo{display:flex;align-items:center;gap:8px}
.logo h1{font-size:16px;font-weight:700}
.logo p{font-size:10px;color:var(--tx2);margin-top:1px}
.hdr-r{text-align:right}
.hdr-date{font-size:18px;font-weight:800;color:var(--acc)}
.hdr-day{font-size:10px;color:var(--tx2);margin-top:2px}
main{max-width:820px;margin:0 auto;padding:16px 16px 0}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:6px 16px;border-radius:20px;border:1.5px solid var(--bdr);background:transparent;color:var(--tx2);cursor:pointer;font-size:12.5px;font-family:inherit;transition:all .15s}
.tab:hover{border-color:var(--acc);color:var(--acc)}
.tab.on{background:var(--acc);border-color:var(--acc);color:#000;font-weight:700}
.block{background:var(--sur);border:1px solid var(--bdr);border-radius:12px;margin-bottom:12px;overflow:hidden}
.block-hdr{padding:14px 16px 0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.block-tag{font-size:9px;color:var(--tx2);letter-spacing:1.5px;text-transform:uppercase;font-weight:600;white-space:nowrap}
.block-title{font-size:28px;font-weight:800;line-height:1.1;color:var(--tx)}
.block-title.sm{font-size:15px;font-weight:600}
.block-body{padding:12px 16px 14px}
/* Bible */
.verse-wrap{max-height:360px;overflow-y:auto;padding-right:4px}
.verse-wrap::-webkit-scrollbar{width:4px}
.verse-wrap::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px}
.stitle{font-size:11.5px;color:var(--acc2);font-weight:600;margin:10px 0 4px}
.verse{display:flex;gap:8px;margin-bottom:7px;line-height:1.8;font-size:13.5px}
.vnum{color:var(--acc);font-size:10.5px;font-weight:700;min-width:20px;margin-top:3px;flex-shrink:0}
.vtxt{color:var(--tx)}
.loading{color:var(--tx2);font-size:12.5px;padding:14px 0;text-align:center}
.bg-link{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:7px;background:rgba(108,143,255,.1);border:1.5px solid rgba(108,143,255,.3);color:var(--acc);font-size:12px;text-decoration:none;margin-top:8px}
.bg-link:hover{background:rgba(108,143,255,.2)}
/* YouTube card */
.yt-card{display:flex;gap:12px;align-items:flex-start;cursor:pointer;text-decoration:none;border-radius:8px;padding:4px;transition:background .15s}
.yt-card:hover{background:var(--sur2)}
.yt-thumb{flex-shrink:0;width:140px;border-radius:6px;overflow:hidden;aspect-ratio:16/9;background:#000}
.yt-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.yt-info{flex:1;min-width:0}
.yt-title{font-size:13.5px;color:var(--tx);line-height:1.5;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.yt-meta{font-size:11px;color:var(--tx2)}
.yt-play{display:inline-flex;align-items:center;gap:5px;margin-top:8px;padding:6px 14px;border-radius:7px;background:var(--red);color:#fff;font-size:12.5px;font-weight:600}
.yt-note{margin-top:10px;padding:7px 10px;background:rgba(251,191,36,.07);border-radius:6px;border:1px solid rgba(251,191,36,.18);font-size:11px;color:var(--yel);line-height:1.6}
.yt-search-btn{display:inline-flex;align-items:center;gap:5px;margin-top:8px;padding:6px 12px;border-radius:7px;background:rgba(248,68,68,.1);border:1.5px solid rgba(248,68,68,.3);color:var(--red);font-size:12px;text-decoration:none}
.yt-search-btn:hover{background:rgba(248,68,68,.2)}
/* Speed */
.speed-range{font-size:22px;font-weight:700;color:var(--acc3);margin:4px 0 10px}
/* Notes */
.notes-txt{font-size:13px;line-height:1.9;color:var(--tx2);max-height:240px;overflow-y:auto;padding-right:4px}
.notes-txt::-webkit-scrollbar{width:4px}
.notes-txt::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px}
/* Strip */
.strip-lbl{font-size:11px;color:var(--tx2);padding:10px 16px 4px;font-weight:600}
.strip{display:flex;gap:5px;overflow-x:auto;padding:0 16px 14px}
.strip::-webkit-scrollbar{height:3px}
.strip::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px}
.sday{flex:0 0 auto;background:var(--sur2);border:1.5px solid transparent;border-radius:7px;padding:6px 9px;text-align:center;cursor:pointer;min-width:56px;transition:all .12s}
.sday:hover{border-color:var(--acc)}
.sday.on{border-color:var(--acc);background:rgba(108,143,255,.12)}
.sday.nodata{opacity:.35;cursor:default}
.sday .sd{font-size:9px;color:var(--tx2);margin-bottom:2px}
.sday.on .sd{color:var(--acc)}
.sday .sc{font-size:10.5px;font-weight:700}
.missing{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.2);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--yel);margin-bottom:10px;display:none}
footer{text-align:center;padding:20px 16px 0;font-size:10.5px;color:var(--tx2);line-height:2}
footer a{color:var(--acc);text-decoration:none}
</style>
</head>
<body>
<header>
  <div class="logo">
    <span style="font-size:22px">📖</span>
    <div><h1>中壢靈糧堂 每日靈糧</h1><p>靈修 1章 · 速讀 5章 · 速讀 10章</p></div>
  </div>
  <div class="hdr-r">
    <div class="hdr-date" id="hdrDate"></div>
    <div class="hdr-day" id="hdrDay"></div>
  </div>
</header>
<main>
  <div class="tabs">
    <button class="tab on" onclick="setP('d',this)">📕 靈修 1章</button>
    <button class="tab" onclick="setP('s5',this)">📗 速讀 5章</button>
    <button class="tab" onclick="setP('s10',this)">📘 速讀 10章</button>
  </div>

  <!-- ① 經文 -->
  <div class="block">
    <div class="block-hdr">
      <span class="block-tag">今日進度</span>
      <span class="block-title" id="chapTitle">—</span>
    </div>
    <div class="block-body">
      <div class="missing" id="missingNote">⚠️ 此月份資料待補充</div>
      <div id="bibleArea"><div class="loading">載入經文…</div></div>
    </div>
  </div>

  <!-- ② YouTube -->
  <div class="block" id="ytBlock">
    <div class="block-hdr">
      <span class="block-tag">JAM 陪你讀聖經</span>
      <span class="block-title sm" id="ytLabel"></span>
    </div>
    <div class="block-body">
      <div id="ytArea"><div class="loading">搜尋影片…</div></div>
    </div>
  </div>

  <!-- ③ 靈修默想 -->
  <div class="block" id="notesBlock" style="display:none">
    <div class="block-hdr">
      <span class="block-tag">靈修默想</span>
      <span class="block-title sm" id="notesTitle"></span>
    </div>
    <div class="block-body">
      <div class="notes-txt" id="notesTxt"></div>
    </div>
  </div>

  <!-- 月份條帶 -->
  <div class="strip-lbl" id="stripLbl"></div>
  <div class="strip" id="strip"></div>

  <footer>
    <a href="https://blccjl.org.tw/dailybread/" target="_blank">中壢靈糧堂每日靈糧</a> ·
    <a href="https://www.youtube.com/@jam2939" target="_blank">JAM愛的影響力（每早 7:11）</a><br>
    資料涵蓋 1–6 月，7–12 月待教會公佈後更新
  </footer>
</main>

,"速讀10章":"詩53-62","摘要":"1-10流便支派。1-2：解釋為何至此才提長子流便的族譜。流便所犯的罪參創卅五22、四九4。長子的名分已轉給約瑟(其二子以法蓮和瑪拿西，雙份)；長子的地位則歸猶大，君王從他而出。 11-17迦得支派。他們居巴珊地，即今以色列北部的戈蘭高地。 18-26約旦河東二支派半。他們佔領鄰近阿拉伯人的地方。作者一再聲明他們得勝是在乎倚賴神。19「伊突人、拿非施人、挪答人」：都是阿拉伯人。22「直到被擄的時候」：指王下十五29比加王年間的被擄(734BC)，在北國以色列滅亡(721BC)前十多年"},"05-08":{"靈修進度":"代上6","速讀5章":"亞14-瑪4","速讀10章":"詩63-72","摘要":"本章記祭司和利未人的家譜及各職務。收錄兩份名單，一份是革順、哥轄、米拉利三支的長子譜系；另一份歌唱的為次子的譜系。 1-15被擄前的大祭司家譜(哥轄的後裔)。 16-30利未人的家譜。含革順、哥轄、米拉利三支。 31-47歌唱的利未人家譜。22：亞米拿達在2、38稱以斯哈。43：雅哈應與示每互換次序，示每乃革順次子(參17、20)。 48-53其他利未人和祭司的職務。 54-81利未支派在各地居住的城邑。"},"05-09":{"靈修進度":"代上7","速讀5章":"太1-5","速讀10章":"詩73-82","摘要":"本章記載約旦河西岸六個支派的族譜： 以薩迦(1～5)l便雅憫(6～12) 拿弗他利(13)l河西之瑪拿西半支派(14～19) 以法蓮(20～29)l亞設(30～40)"},"05-10":{"靈修進度":"代上8","速讀5章":"太6-10","速讀10章":"詩83-92","摘要":"本章再記便雅憫的族譜。此份族譜的特色是以耶路撒冷為中心(28、32)，與上章6-12，及創四六、民廿六所記均不盡相同。 1-7便雅憫的子孫。l8-12寄居摩押地的以色列人。 13-28接續7節，記便雅憫支派的族長。21「示每」：即13節的示瑪。27「耶羅罕」：即14節的耶利末。 29-40住在基遍附近的便雅憫人，藉此引出以色列第一位君王掃羅的家譜。掃羅兒子中只記約拿單一系，或因他是大衛的知己。"},"05-11":{"靈修進度":"代上9","速讀5章":"太11-15","速讀10章":"詩93-102","摘要":"本章總結前八章，記從巴比倫返國居住耶路撒冷的以色列人。 1前面一至八章族譜的總結。「猶太人因犯罪就被擄到巴比倫」是族譜編寫的思路方向，也是整本聖經的重要教訓和規則。 2-3下文返回故土之人的序言。3「猶大人、便雅憫人」代表南國；「以法蓮人、瑪拿西人」代表北國支派。「尼提寧」：聖殿的差役。 4-9猶大和便雅憫支派的領袖。5「示羅」即二3的示拉。 10-16祭司和利未人的首領。16「尼陀法人的村莊」參尼十二28。 17-34利未人的職任。 35-44再記掃羅王的家譜。目的是要引進下一章掃羅被殺的經過。"},"05-12":{"靈修進度":"代上10","速讀5章":"太16-20","速讀10章":"詩103-112","摘要":"族譜記載結束，本書從本章開始進入歷史敘事部分。先記載掃羅戰死沙場，為下章開始的大衛王朝作準備。 1-12掃羅敗亡。6「並他的全家都一同死亡」：僅指“掃羅家“，即掃羅王朝結束，他的後人伊施波設和米非波設依然活著。 13~14總結掃羅戰死的原因：「因為他干犯耶和華」。包括不遵守神的命令；和求問交鬼婦人而不求問神。"},"05-13":{"靈修進度":"代上11","速讀5章":"太21-25","速讀10章":"詩113-121","摘要":"本章至代下九章記錄大衛和所羅門王朝。他們為人不盡完美，但相對於掃羅的，他們求問神，帶下了聖殿、約櫃和敬拜的體系。 1-9大衛被民眾擁護為王，建都耶路撒冷。8「米羅」在耶城東坡。 10-47記大衛的勇士。15：大衛在亞杜蘭洞之事見撒上廿二1-4。"},"05-14":{"靈修進度":"代上12","速讀5章":"太26-可2","速讀10章":"詩122-131","摘要":"本章接續上章介紹跟隨大衛的勇士。 1-22逃亡時期歸附大衛的人。1大衛在洗革拉，見撒上廿七5-7。 23-40在希伯崙擁立大衛作王的人。每一支派都有。32「通達時務」：能認清神的計畫，在轉變的時節把握神方向的一種恩賜。"},"05-15":{"靈修進度":"代上13","速讀5章":"可3-7","速讀10章":"詩132-141","摘要":"由本章開始，從政治轉向宗教方面。首先是大衛迎接約櫃之事。 1-8迎約櫃的安排。5「從埃及的西曷河直到哈馬口」：指以色列境界的最南和最北端，比“從但到別是巴“更廣。西曷河亦稱小河。 function todayKey(){const d=new Date();return`${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}

function parseChap(abbrev){
  const keys=Object.keys(BID).sort((a,b)=>b.length-a.length);
  for(const k of keys){if(abbrev.startsWith(k)){return{id:BID[k],ch:parseInt(abbrev.slice(k.length))||1,abbr:k,full:BGN[k]||k};}}
  return null;
}
function fullName(abbrev){const p=parseChap(abbrev);return p?`${p.full}第${p.ch}章`:abbrev;}

function setP(plan,btn){
  curPlan=plan;
  document.querySelectorAll(".tab").forEach(b=>b.classList.remove("on"));

  loadDay(curKey||todayKey());
  renderStrip();
}

function loadDay(k){
  curKey=k;
  const data=S[k], mo=parseInt(k.slice(0,2)), dy=parseInt(k.slice(3));
  let chap="";
  document.getElementById("missingNote").style.display="none";

  if(curPlan==="d"){
    chap=data?.["靈修進度"]||"";
    document.getElementById("chapTitle").textContent=chap||"（待補充）";
    if(!chap) document.getElementById("missingNote").style.display="block";
    fetchBible(chap, mo, dy);
    // Notes
    const sum=data?.["摘要"]||"";
    if(sum){
      document.getElementById("notesBlock").style.display="block";
      document.getElementById("notesTitle").textContent=fullName(chap);
      document.getElementById("notesTxt").textContent=sum;
    }else document.getElementById("notesBlock").style.display="none";
  }else{
    const f=curPlan==="s5"?"速讀5章":"速讀10章";
    chap=data?.[f]||"";
    document.getElementById("chapTitle").textContent=chap||"（待補充）";
    if(!chap) document.getElementById("missingNote").style.display="block";
    document.getElementById("bibleArea").innerHTML=chap
      ?`<div class="speed-range">${chap}</div><a class="bg-link" href="https://www.biblegateway.com/passage/?search=${encodeURIComponent(chap)}&version=CUVMPT" target="_blank">↗ 在 BibleGateway 閱讀</a>`
      :`<div class="loading">—</div>`;
    document.getElementById("notesBlock").style.display="none";
  }
  document.getElementById("ytBlock").style.display="block";
  fetchYT(chap, mo, dy);
}

function fetchBible(abbrev, mo, dy){
  document.getElementById("bibleArea").innerHTML=`<div class="loading">載入經文…</div>`;
  const p=parseChap(abbrev);
  if(!p||!abbrev){document.getElementById("bibleArea").innerHTML=`<div class="loading">—</div>`;return;}

  const apiUrl=`https://bolls.life/api/CUNP/${p.id}/${p.ch}/`;
  const proxyUrl=`https://api.allorigins.win/raw?url=${encodeURIComponent(apiUrl)}`;

  fetch(proxyUrl)
    .then(r=>{if(!r.ok)throw r.status;return r.json();})
    .then(verses=>{
      let h=`<div class="verse-wrap">`;
      for(const v of verses){
        if(v.title)h+=`<div class="stitle">${v.title}</div>`;
        h+=`<div class="verse"><span class="vnum">${v.verse}</span><span class="vtxt">${v.text}</span></div>`;
      }
      h+=`</div>
      <a class="bg-link" href="https://www.biblegateway.com/passage/?search=${encodeURIComponent(p.full+" "+p.ch)}&version=CUVMPT" target="_blank" style="font-size:11px;margin-top:8px">↗ 繁中和合本 CUVMPT（BibleGateway）</a>`;
      document.getElementById("bibleArea").innerHTML=h;
    })
    .catch(()=>{
      document.getElementById("bibleArea").innerHTML=`
        <div class="loading" style="margin-bottom:8px">載入失敗</div>
        <a class="bg-link" href="https://www.biblegateway.com/passage/?search=${encodeURIComponent(p.full+" "+p.ch)}&version=CUVMPT" target="_blank">↗ 至 BibleGateway 閱讀（CUVMPT）</a>`;
    });
}

// ── YouTube：RSS → 縮圖卡片，不用 iframe ──────────────────
function fetchYT(chap, mo, dy){
  const p=parseChap(chap);
  const chapLabel=p?`${p.full}第${p.ch}章`:chap;
  document.getElementById("ytLabel").textContent=chapLabel;
  document.getElementById("ytArea").innerHTML=`<div class="loading">搜尋影片…</div>`;
  if(!chap){document.getElementById("ytArea").innerHTML=`<div class="loading">—</div>`;return;}

  const rssUrl=`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent("https://www.youtube.com/feeds/videos.xml?channel_id="+YT_CH)}`;
  fetch(rssUrl)
    .then(r=>r.json())
    .then(data=>{
      // 過濾 shorts，只取一般影片
      const items=(data.items||[]).filter(i=>i.link&&!i.link.includes("/shorts/"));
      // 嘗試比對章節
      const fullCh=p?`${p.full}${p.ch}`:"";
      const matched=items.find(i=>{
        const t=i.title||"";
        return t.includes(fullCh)||t.includes(`《${p?.full}${p?.ch}》`)||t.includes(chapLabel);
      });
      const video=matched||items[0];
      const isMatch=!!matched;
      const vid=video?.link?.match(/watch\?v=([^&]+)/)?.[1]||"";
      const thumb=video?.thumbnail||`https://i.ytimg.com/vi/${vid}/hqdefault.jpg`;
      const title=video?.title||"";
      const date=video?.pubDate?.slice(0,10)||"";

      let h=`<a class="yt-card" href="${video?.link||"https://www.youtube.com/@jam2939"}" target="_blank">
        <div class="yt-thumb"><img src="${thumb}" alt="thumbnail" loading="lazy" onerror="this.style.display='none'"></div>
        <div class="yt-info">
          <div class="yt-title">${title}</div>
          <div class="yt-meta">${date}</div>
          <span class="yt-play">▶ 前往觀看</span>
        </div>
      </a>`;

      if(!isMatch&&chap){
        h+=`<div class="yt-note">⚠️ JAM 目前讀到「${items[0]?.title?.match(/《(.+?)》/)?.[1]||"其他章節"}」，與教會進度不同。<br>可搜尋歷史集數：</div>
        <a class="yt-search-btn" href="https://www.youtube.com/@jam2939/search?query=${encodeURIComponent(chapLabel)}" target="_blank">🔍 搜尋《${chapLabel}》所有影片</a>`;
      }
      document.getElementById("ytArea").innerHTML=h;
    })
    .catch(()=>{
      document.getElementById("ytArea").innerHTML=`
        <a class="yt-search-btn" href="https://www.youtube.com/@jam2939/search?query=${encodeURIComponent(chapLabel)}" target="_blank">🔍 搜尋《${chapLabel}》影片</a>`;
    });
}

// ── 月份條帶 ─────────────────────────────────────────────
function renderStrip(){
  const d=new Date(),mo=d.getMonth()+1,today=d.getDate();
  const total=new Date(d.getFullYear(),mo,0).getDate();
  document.getElementById("stripLbl").textContent=`${d.getFullYear()}年${mo}月`;
  const strip=document.getElementById("strip");strip.innerHTML="";
  for(let day=1;day<=total;day++){
    const k=`${String(mo).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const data=S[k];let ch="";
    if(data){if(curPlan==="d")ch=data["靈修進度"]||"";else if(curPlan==="s5")ch=data["速讀5章"]||"";else ch=data["速讀10章"]||"";}
    const el=document.createElement("div");
    el.className=`sday${day===today?" on":""}${!data?" nodata":""}`;
    el.innerHTML=`<div class="sd">${mo}/${day}</div><div class="sc">${(ch||"—").replace(/第/,"").replace(/章$/,"").replace(/篇$/,"")}</div>`;
    if(data)el.onclick=()=>{document.querySelectorAll(".sday").forEach(s=>s.classList.remove("on"));el.classList.add("on");loadDay(k);window.scrollTo({top:0,behavior:"smooth"});};
    strip.appendChild(el);
  }
  setTimeout(()=>{const t=strip.querySelectorAll(".sday")[today-1];if(t)t.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"});},300);
}

if(!new URLSearchParams(location.search).has("api")){renderHeader();loadDay(todayKey());renderStrip();}
