<style>

<script>
const fmtN=n=>n.toLocaleString("en-US");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const FIREBASE_CONFIG={apiKey:"AIzaSyDjlL_b4Uiz0cAQjbdCiePZO9oXrEQm0zI",authDomain:"daily-bread-f88ac.firebaseapp.com",projectId:"daily-bread-f88ac",storageBucket:"daily-bread-f88ac.firebasestorage.app",messagingSenderId:"258444297032",appId:"1:258444297032:web:2287e0259ef81a0ca0a97d"};
const STORE_KEY="journeyDoneBooks"; // 本地備份：book id 陣列
const YEAR_SIG="year365";           // 與 year.html 共用的進度鍵名

let DATA=null, DONE=new Set(), ALLCHARS=0;
let uid=null, userLabel="", cloudReady=false;
let MYGROUPS=[], CURGROUP="", GDOC=null, LIT=new Set();
// 「我正在讀」：[{id,exp}]。存成陣列而非 map——set(merge:true) 會深層合併 map，取消的 key 刪不掉
let READING=[], RDSET=new Set();
const READ_MAX=2, DAY=86400000;
const readDays=b=>Math.max(7,Math.ceil(b.chapters/3)); // 依書卷長度給期限：每 3 章 1 天，最少 7 天

function loadLocal(){try{return new Set((JSON.parse(localStorage.getItem(STORE_KEY)||"[]")).map(Number));}catch(e){return new Set();}}
function saveLocal(){try{localStorage.setItem(STORE_KEY,JSON.stringify([...DONE]));}catch(e){}}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800);}

async function boot(){
  DATA=await fetch("data/book_journey.json").then(r=>r.json());
  ALLCHARS=DATA.books.reduce((s,b)=>s+b.totalChars,0);
  DONE=loadLocal();
  render();renderGroups();
  initCloud();
}

/* ────────── 雲端：個人進度 ────────── */
function initCloud(){
  updateSyncUI();
  if(!window.firebase)return;
  try{firebase.initializeApp(FIREBASE_CONFIG);cloudReady=true;}catch(e){console.warn("Firebase init 失敗",e);return;}
  firebase.auth().onAuthStateChanged(async u=>{
    if(u&&!u.isAnonymous){
      uid=u.uid;userLabel=u.email||u.displayName||"Google";
      try{await pullUser();}catch(e){console.warn(e);}
    }else{
      uid=null;userLabel="";MYGROUPS=[];CURGROUP="";GDOC=null;
    }
    updateSyncUI();render();renderGroups();
  });
}
function cloudSignIn(){
  if(!cloudReady){alert("雲端尚未設定");return;}
  firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>alert("登入失敗："+e.message));
}
function cloudSignOut(){if(cloudReady)firebase.auth().signOut();}

// 首次登入：本地與雲端取「聯集」，兩邊的紀錄都不會被蓋掉
async function pullUser(){
  const db=firebase.firestore();
  const snap=await db.collection("users").doc(uid).get();
  const d=snap.exists?(snap.data()||{}):{};
  const cloud=Array.isArray(d.journeyBooks)?d.journeyBooks.map(Number):[];
  const before=DONE.size;
  cloud.forEach(id=>DONE.add(id));
  saveLocal();
  if(DONE.size!==cloud.length||DONE.size!==before)await pushUser();
  READING=Array.isArray(d.journeyReading)?d.journeyReading.filter(r=>r&&r.id):[];
  MYGROUPS=[];
  const gids=Array.isArray(d.myGroups)?d.myGroups:[];
  for(const gid of gids){
    try{
      const gs=await db.collection("groups").doc(gid).get();
      if(gs.exists)MYGROUPS.push({id:gid,name:(gs.data()||{}).name||gid});
    }catch(e){console.warn("讀取群組失敗",gid,e);}
  }
  if(MYGROUPS.length&&!MYGROUPS.some(g=>g.id===CURGROUP))CURGROUP=MYGROUPS[0].id;
  await pruneReading();
  if(CURGROUP)await loadGroup(CURGROUP);
}
// merge:true 很重要：不能蓋掉 year.html 寫在同一份文件裡的 progress / profile
async function pushUser(){
  if(!uid||!cloudReady)return;
  await firebase.firestore().collection("users").doc(uid).set({
    journeyBooks:[...DONE],journeyReading:READING,journeyUpdatedAt:Date.now(),ts:Date.now()
  },{merge:true});
}
function updateSyncUI(){
  const bar=document.getElementById("syncBar");if(!bar)return;
  if(!cloudReady){bar.innerHTML='<span class="syncdot"></span>進度存在這台裝置';return;}
  if(uid)bar.innerHTML='<span class="syncdot on"></span>已登入：'+esc(userLabel)+' <button class="syncbtn" onclick="cloudSignOut()">登出</button>';
  else bar.innerHTML='<span class="syncdot"></span>進度只存在這台裝置 <button class="syncbtn" onclick="cloudSignIn()">☁ Google 登入以跨裝置同步</button>';
}

/* ────────── 群組：個人進度是全域的，群組只是不同的觀看視角 ────────── */
function genCode(n){const s="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";return Array.from({length:n},()=>s[Math.floor(Math.random()*s.length)]).join("");}
function litSet(){
  const s=new Set();
  if(GDOC&&GDOC.coverage)Object.keys(GDOC.coverage).forEach(k=>{
    const arr=GDOC.coverage[k];
    if(Array.isArray(arr)&&arr.length)s.add(Number(String(k).replace(/^b/,"")));
  });
  return s;
}
async function loadGroup(gid){
  if(!cloudReady||!gid){GDOC=null;return;}
  try{
    const snap=await firebase.firestore().collection("groups").doc(gid).get();
    GDOC=snap.exists?(snap.data()||{}):null;
  }catch(e){console.warn(e);GDOC=null;}
}
async function switchGroup(gid){CURGROUP=gid;await loadGroup(gid);renderGroups();render();}

async function createGroup(){
  if(!uid){alert("請先用 Google 登入才能建立群組");return;}
  const name=(prompt("群組名稱（例如：公司團契、青年小組）：")||"").trim();
  if(!name)return;
  const db=firebase.firestore(), gid=genCode(8);
  const coverage={};
  [...DONE].forEach(id=>{coverage["b"+id]=[uid];});
  const reading={};
  READING.filter(r=>r.exp>Date.now()).forEach(r=>{reading["b"+r.id]={[uid]:r.exp};});
  try{
    await db.collection("groups").doc(gid).set({name,ownerUid:uid,createdAt:Date.now(),memberCount:1,coverage,reading});
    await db.collection("groups").doc(gid).collection("members").doc(uid).set({name:userLabel,joinedAt:Date.now()});
    await db.collection("users").doc(uid).set({myGroups:firebase.firestore.FieldValue.arrayUnion(gid)},{merge:true});
  }catch(e){alert("建立失敗："+e.message);return;}
  MYGROUPS.push({id:gid,name});CURGROUP=gid;
  await loadGroup(gid);renderGroups();
  prompt("群組「"+name+"」建立完成。\n把這組邀請碼傳到你的 LINE 群，大家輸入就能加入：",gid);
}
async function joinGroup(){
  if(!uid){alert("請先用 Google 登入才能加入群組");return;}
  const code=(prompt("輸入邀請碼：")||"").trim().toUpperCase();
  if(!code)return;
  const db=firebase.firestore(), ref=db.collection("groups").doc(code);
  let snap;
  try{snap=await ref.get();}catch(e){alert("查詢失敗："+e.message);return;}
  if(!snap.exists){alert("找不到這組邀請碼，請再確認一次。");return;}
  if(MYGROUPS.some(g=>g.id===code)){await switchGroup(code);toast("你已經在這個群組裡了");return;}
  const FV=firebase.firestore.FieldValue;
  const patch={memberCount:FV.increment(1)};
  [...DONE].forEach(id=>{patch["coverage.b"+id]=FV.arrayUnion(uid);}); // 帶著自己讀過的書進來，立刻有貢獻
  READING.filter(r=>r.exp>Date.now()).forEach(r=>{patch["reading.b"+r.id+"."+uid]=r.exp;});
  try{
    await ref.update(patch);
    await ref.collection("members").doc(uid).set({name:userLabel,joinedAt:Date.now()});
    await db.collection("users").doc(uid).set({myGroups:FV.arrayUnion(code)},{merge:true});
  }catch(e){alert("加入失敗："+e.message);return;}
  MYGROUPS.push({id:code,name:(snap.data()||{}).name||code});
  CURGROUP=code;await loadGroup(code);renderGroups();render();
  toast("已加入群組");
}
async function leaveGroup(){
  if(!uid||!CURGROUP)return;
  const g=MYGROUPS.find(x=>x.id===CURGROUP);
  if(!confirm("確定退出「"+(g?g.name:CURGROUP)+"」？\n你個人的讀經進度不會消失，只是不再算進這個群組。"))return;
  const db=firebase.firestore(), FV=firebase.firestore.FieldValue, ref=db.collection("groups").doc(CURGROUP);
  const patch={memberCount:FV.increment(-1)};
  try{
    // 只動自己有點亮的書卷；只剩自己一人時整個 key 刪掉，避免 coverage 留下空陣列
    const gd=(await ref.get()).data()||{}, cov=gd.coverage||{}, rd=gd.reading||{};
    Object.keys(cov).forEach(k=>{if(Array.isArray(cov[k])&&cov[k].includes(uid))patch["coverage."+k]=cov[k].length===1?FV.delete():FV.arrayRemove(uid);});
    Object.keys(rd).forEach(k=>{if(rd[k]&&uid in rd[k])patch["reading."+k+"."+uid]=FV.delete();});
    await ref.update(patch);
    await ref.collection("members").doc(uid).delete();
    await db.collection("users").doc(uid).set({myGroups:FV.arrayRemove(CURGROUP)},{merge:true});
  }catch(e){console.warn(e);}
  MYGROUPS=MYGROUPS.filter(x=>x.id!==CURGROUP);
  CURGROUP=MYGROUPS.length?MYGROUPS[0].id:"";GDOC=null;
  if(CURGROUP)await loadGroup(CURGROUP);
  renderGroups();render();
}
function showCode(){
  if(!CURGROUP)return;
  const g=MYGROUPS.find(x=>x.id===CURGROUP);
  prompt("「"+(g?g.name:"")+"」的邀請碼（傳給想一起讀的人）：",CURGROUP);
}
// 完成／取消一卷時，同步更新自己所屬的每一個群組
async function updateCoverageAll(bookId,on){
  if(!uid||!cloudReady||!MYGROUPS.length)return;
  const db=firebase.firestore(), FV=firebase.firestore.FieldValue;
  const patch={};
  patch["coverage.b"+bookId]=on?FV.arrayUnion(uid):FV.arrayRemove(uid);
  await Promise.all(MYGROUPS.map(g=>db.collection("groups").doc(g.id).update(patch).catch(e=>console.warn(e))));
}

/* ────────── 「我正在讀」：淺色標記，幫群組分工；不是鎖，別人照樣可以讀 ────────── */
function myReading(id){const r=READING.find(x=>x.id===id);return r&&r.exp>Date.now()?r:null;}
// 群組裡「別人」正在讀的書卷（過期的不算）
function othersReadingSet(){
  const s=new Set(), now=Date.now();
  if(GDOC&&GDOC.reading)Object.keys(GDOC.reading).forEach(k=>{
    const m=GDOC.reading[k]||{};
    if(Object.keys(m).some(u=>u!==uid&&Number(m[u])>now))s.add(Number(String(k).replace(/^b/,"")));
  });
  return s;
}
function readingPatch(id,exp){
  const FV=firebase.firestore.FieldValue, p={};
  p["reading.b"+id+"."+uid]=exp?exp:FV.delete();
  return p;
}
async function syncReading(patch){
  if(!uid||!cloudReady)return;
  const db=firebase.firestore();
  await pushUser();
  if(patch&&Object.keys(patch).length)
    await Promise.all(MYGROUPS.map(g=>db.collection("groups").doc(g.id).update(patch).catch(e=>console.warn(e))));
}
// 過期或已讀完的標記清掉（自己的），群組那邊一併刪 key
async function pruneReading(){
  const now=Date.now(), drop=READING.filter(r=>r.exp<=now||DONE.has(r.id));
  if(!drop.length)return;
  READING=READING.filter(r=>!drop.includes(r));
  const patch={};drop.forEach(r=>Object.assign(patch,readingPatch(r.id,0)));
  await syncReading(patch);
}
async function setReading(id,on){
  if(!uid||!MYGROUPS.length)return;
  const b=DATA.books.find(x=>x.id===id);if(!b)return;
  if(on){
    READING=READING.filter(r=>r.exp>Date.now()&&!DONE.has(r.id)&&r.id!==id);
    if(READING.length>=READ_MAX){toast("最多同時標 "+READ_MAX+" 卷，先讀完或取消一卷吧");return;}
    const exp=Date.now()+readDays(b)*DAY;
    READING.push({id,exp});
    render();renderGroups();
    toast("已標記正在讀《"+b.full+"》，"+readDays(b)+" 天內有效");
    await syncReading(readingPatch(id,exp));
  }else{
    READING=READING.filter(r=>r.id!==id);
    render();renderGroups();
    await syncReading(readingPatch(id,0));
  }
  if(CURGROUP){await loadGroup(CURGROUP);renderGroups();render();}
}

function renderGroups(){
  const box=document.getElementById("groupBody");if(!box)return;
  if(!cloudReady){box.innerHTML='<p class="muted">雲端尚未設定，群組功能無法使用。</p>';return;}
  if(!uid){
    box.innerHTML='<p class="muted"><b>一個人走得快，一群人走得遠。</b>找幾個弟兄姊妹，一起把 66 卷書點亮——每一卷只要有<b>一個人</b>讀完就會亮起來，你讀的每一卷，都是送給大家的一盞燈。看板只顯示哪幾卷亮了，不會列出是誰讀的。</p>'
      +'<div class="toolbar"><button class="qbtn pri" onclick="cloudSignIn()">☁ Google 登入</button></div>';
    return;
  }
  if(!MYGROUPS.length){
    box.innerHTML='<p class="muted">一個人走得快，一群人走得遠。建立一個群組，把邀請碼傳到你的 LINE 群，讓我們合力讀完整本聖經。<br>'
      +'<b>你目前已讀完的 '+DONE.size+' 卷，會立刻幫新群組點亮 '+DONE.size+' 格。</b></p>'
      +'<div class="toolbar"><button class="qbtn pri" onclick="createGroup()">＋ 建立群組</button><button class="qbtn" onclick="joinGroup()">輸入邀請碼加入</button></div>';
    return;
  }
  const lit=litSet(), total=DATA.books.length, rds=othersReadingSet();
  READING.forEach(r=>{if(r.exp>Date.now())rds.add(r.id);}); // 自己正在讀的也顯示淺色
  const litChars=DATA.books.filter(b=>lit.has(b.id)).reduce((s,b)=>s+b.totalChars,0);
  let h="";
  if(MYGROUPS.length>1){
    h+='<select onchange="switchGroup(this.value)" style="margin-bottom:4px">'
      +MYGROUPS.map(g=>'<option value="'+esc(g.id)+'"'+(g.id===CURGROUP?' selected':'')+'>'+esc(g.name)+'</option>').join("")+'</select>';
  }else{
    h+='<p class="muted" style="margin-bottom:4px"><b>'+esc(MYGROUPS[0].name)+'</b></p>';
  }
  h+='<div class="stats">'
    +'<div class="stat"><b>'+lit.size+'/'+total+'</b>已點亮書卷</div>'
    +'<div class="stat"><b>'+(Math.round(litChars/ALLCHARS*1000)/10)+'%</b>字數覆蓋</div>'
    +'<div class="stat"><b>'+((GDOC&&GDOC.memberCount)||1)+'</b>一起讀的人</div></div>';
  const remain=total-lit.size;
  h+=remain===0
    ? '<p class="muted" style="margin-top:12px;color:var(--acc3)"><b>🏆 66 卷全部點亮了——這個群組一起讀完了整本聖經。</b></p>'
    : '<p class="muted" style="margin-top:12px">已經一起點亮了 <b>'+lit.size+'</b> 盞燈，還有 <b>'+remain+'</b> 卷在等人走進去。點一下灰色格子，看看那一卷在說什麼。</p>';
  h+='<div class="gmap">'+DATA.books.slice().sort((a,b)=>a.id-b.id).map(b=>{
      const on=lit.has(b.id), rd=!on&&rds.has(b.id);
      return '<div class="gcell'+(on?' on':rd?' reading':'')+'" title="'+esc(b.full)+(on?'：已點亮':rd?'：有人正在讀':'：還沒有人讀過')+'" onclick="jumpToBook('+b.id+')">'+esc(b.abbr||b.full)+'</div>';
    }).join("")+'</div>'
    +'<p class="muted" style="font-size:11.5px;margin-top:6px">實心＝已點亮　虛線淺色＝有人正在讀（不是佔位，想一起讀也很好）。在下方書卷按「＋ 我在讀」，讓大家知道你走到哪。</p>';
  h+='<div class="toolbar"><button class="qbtn" onclick="showCode()">🔢 顯示邀請碼</button>'
    +'<button class="qbtn" onclick="createGroup()">＋ 另外建一個</button>'
    +'<button class="qbtn" onclick="joinGroup()">加入其他群組</button>'
    +'<button class="qbtn" onclick="leaveGroup()">退出這個群組</button></div>';
  box.innerHTML=h;
}
function jumpToBook(id,retried){
  const el=document.querySelector('[data-book="'+id+'"]');
  if(!el){
    if(retried)return;
    document.getElementById("orderSel").value="canon";render();
    setTimeout(()=>jumpToBook(id,true),60);return;
  }
  el.scrollIntoView({behavior:"smooth",block:"center"});
  el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),1600);
}

/* ────────── 個人清單 ────────── */
function sortedBooks(order){
  const books=DATA.books.slice();
  if(order==="chron")return books.sort((a,b)=>a.chronOrder-b.chronOrder);
  if(order==="easy")return books.sort((a,b)=>a.totalChars-b.totalChars);
  return books.sort((a,b)=>a.id-b.id);
}
function render(){
  const order=document.getElementById("orderSel").value;
  LIT=litSet(); // 每次重繪算一次就好，書列不用逐卷重算
  RDSET=othersReadingSet();
  const total=DATA.books.length, doneCount=DONE.size;
  const doneChars=DATA.books.filter(b=>DONE.has(b.id)).reduce((s,b)=>s+b.totalChars,0);
  const bookPct=Math.round(doneCount/total*1000)/10;
  const charPct=Math.round(doneChars/ALLCHARS*1000)/10;
  document.getElementById("barBooks").style.width=bookPct+"%";
  document.getElementById("barChars").style.width=charPct+"%";
  document.getElementById("stDone").textContent=doneCount+"/"+total;
  document.getElementById("stPct").textContent=bookPct+"%";
  document.getElementById("stChars").textContent=fmtN(doneChars)+" / "+fmtN(ALLCHARS);
  document.getElementById("stCharPct").textContent=charPct+"%";
  renderBadges();

  const list=document.getElementById("bookList");
  list.innerHTML="";
  const frag=document.createDocumentFragment();
  if(order==="category"){
    DATA.categories.forEach(cat=>{
      const h=document.createElement("div");h.className="grp-h";h.textContent=cat;frag.appendChild(h);
      DATA.books.filter(b=>b.category===cat).sort((a,b)=>a.id-b.id).forEach(b=>frag.appendChild(bookRow(b)));
    });
  }else{
    sortedBooks(order).forEach(b=>frag.appendChild(bookRow(b)));
  }
  list.appendChild(frag);
}
function shortTag(b){
  const sorted=DATA.books.slice().sort((a,b2)=>a.totalChars-b2.totalChars);
  return sorted.findIndex(x=>x.id===b.id)<15;
}
function bookRow(b){
  const isDone=DONE.has(b.id), easy=shortTag(b);
  const isGap=MYGROUPS.length&&!LIT.has(b.id)&&!RDSET.has(b.id); // 群組還沒有人讀過、也沒人正在讀
  const othersRd=MYGROUPS.length&&!LIT.has(b.id)&&RDSET.has(b.id);
  const mine=myReading(b.id), canMark=uid&&MYGROUPS.length&&!isDone;
  const left=mine?Math.max(1,Math.ceil((mine.exp-Date.now())/DAY)):0;
  const div=document.createElement("div");
  div.className="book"+(isDone?" done":"");
  div.setAttribute("data-book",b.id);
  div.innerHTML='<div class="book-h">'
    +'<input type="checkbox" class="chk" '+(isDone?'checked':'')+' aria-label="標記'+esc(b.full)+'完成">'
    +'<span class="bname'+(isDone?' done':'')+'"><a class="blink" href="index.html?ref='+encodeURIComponent(b.abbr+(b.chapters>1?'1':''))+'" title="打開《'+esc(b.full)+'》經文">'+esc(b.full)+'</a>'
      +(easy?'<span class="tag short">易讀</span>':'')
      +(isGap?'<span class="tag gap">群組還沒人讀</span>':'')
      +(othersRd?'<span class="tag reading">有人在讀</span>':'')
    +'</span>'
    +'<span class="bmeta">'+b.chapters+'章・約'+fmtN(b.totalChars)+'字</span>'
    +(canMark?'<button class="rbtn'+(mine?' on':'')+'" aria-label="'+(mine?'取消正在讀':'標記正在讀')+esc(b.full)+'">'+(mine?'📖 在讀・剩'+left+'天':'＋ 我在讀')+'</button>':'')
    +'</div><div class="book-b"><p>'+esc(b.intro)+'</p></div>';
  const chk=div.querySelector(".chk"), head=div.querySelector(".book-h"), body=div.querySelector(".book-b");
  chk.onclick=e=>{e.stopPropagation();toggleBook(b.id,chk.checked);};
  head.onclick=()=>body.classList.toggle("open");
  div.querySelector(".blink").onclick=e=>e.stopPropagation(); // 點書名去讀經文，不展開也不打勾
  const rb=div.querySelector(".rbtn");
  if(rb)rb.onclick=e=>{e.stopPropagation();setReading(b.id,!mine);};
  return div;
}
async function toggleBook(id,on){
  on?DONE.add(id):DONE.delete(id);
  saveLocal();render();
  if(on){const b=DATA.books.find(x=>x.id===id);if(b)toast("讀完《"+b.full+"》了，這一步走得很好 🌱");}
  if(!uid||!cloudReady)return;
  try{
    if(on&&READING.some(r=>r.id===id)){READING=READING.filter(r=>r.id!==id);await syncReading(readingPatch(id,0));}
    else await pushUser();
    await updateCoverageAll(id,on);
    if(CURGROUP){await loadGroup(CURGROUP);renderGroups();render();}
  }catch(e){console.warn(e);}
}

function renderBadges(){
  const doneBooks=DATA.books.filter(b=>DONE.has(b.id));
  const total=DATA.books.length;
  const easyIds=new Set(DATA.books.slice().sort((a,b)=>a.totalChars-b.totalChars).slice(0,10).map(b=>b.id));
  const doneChars=doneBooks.reduce((s,b)=>s+b.totalChars,0);
  const badgeDefs=[
    {label:"🚀 跨出第一步", on: doneBooks.length>=1},
    {label:"📖 讀完 10 卷", on: doneBooks.length>=10},
    {label:"🌗 書卷過半（33 卷）", on: doneBooks.length>=33},
    {label:"🐘 啃完一本大部頭", on: doneBooks.some(b=>b.totalChars>=40000)},
    {label:"⚖️ 字數過半", on: doneChars>=ALLCHARS/2},
    {label:"🌱 短卷收集家", on: [...easyIds].every(id=>DONE.has(id))},
    {label:"📜 律法書通關", on: DATA.books.filter(b=>b.category==="律法書").every(b=>DONE.has(b.id))},
    {label:"🏛 歷史書通關", on: DATA.books.filter(b=>b.category==="歷史書").every(b=>DONE.has(b.id))},
    {label:"🕊 智慧書通關", on: DATA.books.filter(b=>b.category==="智慧書").every(b=>DONE.has(b.id))},
    {label:"🔥 先知書通關", on: DATA.books.filter(b=>b.category==="先知書").every(b=>DONE.has(b.id))},
    {label:"✝️ 新約通關", on: DATA.books.filter(b=>b.category==="新約").every(b=>DONE.has(b.id))},
    {label:"🏆 全本聖經完成", on: doneBooks.length>=total},
  ];
  document.getElementById("badges").innerHTML=badgeDefs.map(d=>'<span class="badge'+(d.on?' on':'')+'">'+d.label+'</span>').join("");
}

/* ────────── 推薦：有群組時優先補「還沒人讀過」的空白 ────────── */
function suggestEasy(){
  const box=document.getElementById("suggestBox"), txt=document.getElementById("suggestText");
  const mine=DATA.books.filter(b=>!DONE.has(b.id));
  if(!mine.length){txt.innerHTML="你已經把 66 卷都讀完了。🏆";box.style.display="";return;}
  const lit=litSet();
  const rds=othersReadingSet();
  const gap=MYGROUPS.length?mine.filter(b=>!lit.has(b.id)&&!rds.has(b.id)):[];
  const pool=(gap.length?gap:mine).slice().sort((a,b)=>a.totalChars-b.totalChars);
  const b=pool[0];
  txt.innerHTML=gap.length
    ? '<b>'+esc(b.full)+'</b>只有 '+b.chapters+' 章、約 '+fmtN(b.totalChars)+' 字，而且<b>你的群組還沒有人讀過、也沒人正在讀這一卷</b>——讀完就能幫大家點亮一格。'
    : '<b>'+esc(b.full)+'</b>只有 '+b.chapters+' 章、約 '+fmtN(b.totalChars)+' 字，現在很適合先完成它。';
  box.style.display="";
  document.getElementById("orderSel").value="easy";render();
  setTimeout(()=>jumpToBook(b.id),60);
}

/* ────────── 從一年讀經計畫匯入（一次性動作，匯入後可自由取消） ────────── */
async function importFromYear(){
  let days=null;
  if(uid&&cloudReady){
    try{
      const snap=await firebase.firestore().collection("users").doc(uid).get();
      const d=snap.exists?(snap.data()||{}):{};
      if(d.progress&&Array.isArray(d.progress[YEAR_SIG]))days=d.progress[YEAR_SIG];
    }catch(e){console.warn(e);}
  }
  if(!days){try{const raw=localStorage.getItem(YEAR_SIG);if(raw)days=JSON.parse(raw);}catch(e){}}
  if(!days||!days.length){alert("找不到一年讀經計畫的進度紀錄。\n先到「一年讀經」頁面勾選幾天，或用同一個 Google 帳號登入。");return;}
  let plan;
  try{plan=await fetch("data/year_plan.json").then(r=>r.json());}catch(e){alert("讀不到 year_plan.json");return;}
  const chapters=new Set();
  days.forEach(i=>{const day=plan.days[i];if(Array.isArray(day))day.forEach(c=>chapters.add(c));});
  const added=[];
  DATA.books.forEach(b=>{
    if(DONE.has(b.id))return;
    let all=true;
    for(let c=1;c<=b.chapters;c++){
      const key=(b.chapters===1)?b.full:(b.full+c);
      if(!chapters.has(key)){all=false;break;}
    }
    if(all){DONE.add(b.id);added.push(b);}
  });
  if(!added.length){alert("一年讀經計畫裡目前還沒有任何一卷「整卷」讀完，所以沒有可以匯入的書卷。");return;}
  saveLocal();render();
  if(uid&&cloudReady){
    try{
      await pushUser();
      for(const b of added)await updateCoverageAll(b.id,true);
      if(CURGROUP){await loadGroup(CURGROUP);renderGroups();render();}
    }catch(e){console.warn(e);}
  }
  alert("已匯入 "+added.length+" 卷：\n"+added.map(b=>b.full).join("、"));
}

/* ────────── 檔案備份 ────────── */
function exportProgress(){
  const blob=new Blob([JSON.stringify({done:[...DONE],exportedAt:new Date().toISOString()},null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download="書卷旅程進度.json";a.click();
}
function importProgress(ev){
  const file=ev.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=async()=>{
    try{
      const d=JSON.parse(reader.result);
      if(!Array.isArray(d.done)){alert("檔案格式不對");return;}
      d.done.map(Number).forEach(id=>DONE.add(id)); // 聯集，不覆蓋
      saveLocal();render();
      if(uid&&cloudReady){await pushUser();for(const id of d.done.map(Number))await updateCoverageAll(id,true);if(CURGROUP){await loadGroup(CURGROUP);renderGroups();render();}}
      alert("匯入完成");
    }catch(e){alert("檔案格式不對");}
  };
  reader.readAsText(file);
}

boot();
